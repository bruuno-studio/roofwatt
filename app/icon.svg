<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="55%" stop-color="#FAFBF7"/>
      <stop offset="100%" stop-color="#E5F2E6"/>
    </linearGradient>
    <radialGradient id="sun" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FFF7D6"/>
      <stop offset="55%" stop-color="#F7C65E"/>
      <stop offset="100%" stop-color="#E9A033"/>
    </radialGradient>
    <linearGradient id="panel" x1="10" y1="26" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#255A4A"/>
      <stop offset="100%" stop-color="#357A60"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#528A5F" stroke-opacity="0.22" stroke-width="2"/>
  <!-- Soft meadow base -->
  <path d="M4 51 Q 32 42 60 51 V 58 Q 60 60 58 60 H 6 Q 4 60 4 58 Z" fill="#84BD8D" fill-opacity="0.34"/>
  <!-- Radiant Solarpunk sun -->
  <circle cx="44" cy="19" r="10.5" fill="#F7C65E" fill-opacity="0.28"/>
  <circle cx="44" cy="19" r="7" fill="url(#sun)"/>
  <!-- Angled photovoltaic solar panel -->
  <polygon points="10,41 37,25 53,39 26,53" fill="url(#panel)" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Cell grid lines -->
  <line x1="23.5" y1="33" x2="39.5" y2="46" stroke="#B7DDBB" stroke-opacity="0.7" stroke-width="1.5"/>
  <line x1="18" y1="47" x2="45" y2="32" stroke="#B7DDBB" stroke-opacity="0.65" stroke-width="1.5"/>
</svg>
